name: Seggs validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore the Zig toolchain
        id: zig
        uses: actions/cache@v5
        with:
          path: .deps/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.json') }}
      - name: Install exact Zig release
        if: steps.zig.outputs.cache-hit != 'true'
        run: python3 tools/install_zig.py
      - name: Zig on PATH
        run: echo "$GITHUB_WORKSPACE/.deps/zig" >> "$GITHUB_PATH"
      - name: Pure core tests
        run: zig build test
      - name: Python fixture tests
        run: python3 -m unittest discover -s tests -v
      - name: Repository contracts
        run: python3 tools/check_repo.py
      - name: Restore mdBook
        id: mdbook
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/mdbook
          key: mdbook-0.5.4-${{ runner.os }}-${{ runner.arch }}
      - name: Install mdBook
        if: steps.mdbook.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
      - name: mdBook on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Book
        run: mdbook build
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config python3 \
            libfreetype6-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxrender-dev \
            libxtst-dev glslang-tools libvulkan-dev mesa-vulkan-drivers \
            vulkan-validationlayers \
            fonts-dejavu-core fonts-wqy-zenhei xvfb
      - name: Restore the Zig toolchain
        id: zig
        uses: actions/cache@v5
        with:
          path: .deps/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.json') }}
      - name: Restore the SDL prefix
        uses: actions/cache@v5
        with:
          path: |
            .deps/src
            .deps/build
            .deps/install
            .deps/zig-ghostty
          key: sdl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.json', 'tools/bootstrap.py', 'tools/bootstrap_ghostty.py') }}
      - name: Install Zig and SDL baseline
        run: |
          # `--install-zig` refuses to replace an existing toolchain, which is
          # what a restored cache already is.
          if [ -d .deps/zig ]; then python3 tools/bootstrap.py; else python3 tools/bootstrap.py --install-zig; fi
          echo "$GITHUB_WORKSPACE/.deps/zig" >> "$GITHUB_PATH"
      - name: Restore the Zig package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/zig
          key: zigpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zigpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Core, native ACP, and compile gates
        run: zig build verify
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json
      - name: Extension bundles
        run: |
          # esbuild is a development dependency, so the bundles need it installed.
          npm ci --prefix extensions --no-audit --no-fund
          node extensions/build.mjs
      - name: Screenshot comparison
        env:
          SDL_VIDEODRIVER: x11
        run: zig build screenshot
      - name: Keep the captures when they disagree
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: /tmp/seggs-shot-*.ppm
      - name: Vulkan window smoke
        env:
          SDL_VIDEODRIVER: x11
        run: |
          LVP=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)
          test -n "$LVP"
          VK_ICD_FILENAMES="$LVP" xvfb-run -a zig build run -- --windowed --frames 8

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Restore the Zig toolchain
        id: zig
        uses: actions/cache@v5
        with:
          path: .deps/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.json') }}
      - name: Restore Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.json') }}-moltenvk
      - name: Restore the Zig package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/zig
          key: zigpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zigpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore the terminal library
        uses: actions/cache@v5
        with:
          path: |
            .deps/install
            .deps/src/ghostty
            .deps/zig-ghostty
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.json', 'tools/bootstrap_ghostty.py') }}
      - name: Install Zig and SDL
        run: |
          # The toolchain installer refuses to replace what a cache restored.
          if [ ! -d .deps/zig ]; then python3 tools/install_zig.py; fi
          echo "$GITHUB_WORKSPACE/.deps/zig" >> "$GITHUB_PATH"
          brew install sdl3 sdl3_ttf vulkan-loader molten-vk vulkan-validationlayers
      - name: Build the terminal library
        run: python3 tools/bootstrap_ghostty.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json
      - name: Extension bundles
        run: |
          # esbuild is a development dependency, so the bundles need it installed.
          npm ci --prefix extensions --no-audit --no-fund
          node extensions/build.mjs
      - name: Core, native ACP, and compile gates
        run: zig build verify -Dsdl-prefix="$(brew --prefix)" -Dghostty-prefix=.deps/install
      - name: Vulkan over Metal
        run: zig build screenshot -Dsdl-prefix="$(brew --prefix)" -Dghostty-prefix=.deps/install

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Restore the Zig toolchain
        id: zig
        uses: actions/cache@v5
        with:
          path: .deps/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.json') }}
      - name: Install Zig
        if: steps.zig.outputs.cache-hit != 'true'
        run: python tools/install_zig.py
      - name: Restore the SDL prefix and glslang
        id: sdk
        uses: actions/cache@v5
        with:
          path: |
            .deps/win
            .deps/tools
          key: winsdk-${{ runner.arch }}-${{ hashFiles('dependencies.json') }}-glslang-16.6.0
      - name: Restore the Zig package cache
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\zig
          key: zigpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zigpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore the terminal library
        uses: actions/cache@v5
        with:
          path: |
            .deps/install
            .deps/src/ghostty
            .deps/zig-ghostty
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.json', 'tools/bootstrap_ghostty.py') }}
      - name: SDL, glslang, and PATH
        if: steps.sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # docs/BUILD.md: matching SDL3 and SDL3_ttf development libraries in
          # one prefix, their DLL directory on PATH, and shader compilation.
          $prefix = "$env:GITHUB_WORKSPACE/.deps/win"
          $tools = "$env:GITHUB_WORKSPACE/.deps/tools"
          New-Item -ItemType Directory -Force -Path "$prefix/include", "$prefix/lib", "$tools" | Out-Null
          # The versions come from dependencies.json, so a pin bump moves the
          # archives and the cache key together.
          $pins = Get-Content "$env:GITHUB_WORKSPACE/dependencies.json" | ConvertFrom-Json
          $packages = @(
            @{ name = "SDL3";     url = "https://github.com/libsdl-org/SDL/releases/download/$($pins.SDL.tag)/SDL3-devel-$($pins.SDL.tag -replace '^release-','')-VC.zip" },
            @{ name = "SDL3_ttf"; url = "https://github.com/libsdl-org/SDL_ttf/releases/download/$($pins.SDL_ttf.tag)/SDL3_ttf-devel-$($pins.SDL_ttf.tag -replace '^release-','')-VC.zip" }
          )
          foreach ($package in $packages) {
            $archive = "$env:TEMP/$($package.name).zip"
            Invoke-WebRequest -Uri $package.url -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath "$env:TEMP/$($package.name)" -Force
            Copy-Item -Recurse -Force "$env:TEMP/$($package.name)/*/include/*" "$prefix/include/"
            Copy-Item -Force "$env:TEMP/$($package.name)/*/lib/x64/*" "$prefix/lib/"
          }
          Invoke-WebRequest -Uri "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip" -OutFile "$env:TEMP/glslang.zip"
          Expand-Archive -Path "$env:TEMP/glslang.zip" -DestinationPath "$tools/glslang" -Force
      - name: Runtime and tools on PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE/.deps/zig" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # CMake installs a Windows DLL into bin, not lib: a test binary links
          # the import library and loads the DLL, so both directories belong on
          # the path.
          "$env:GITHUB_WORKSPACE/.deps/win/lib" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$env:GITHUB_WORKSPACE/.deps/win/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$env:GITHUB_WORKSPACE/.deps/install/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$env:GITHUB_WORKSPACE/.deps/tools/glslang/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build the terminal library
        run: python tools/bootstrap_ghostty.py
      - name: Shader compiler
        shell: pwsh
        run: |
          # The build runs exactly this; running it here separates a broken tool
          # from a broken invocation in the build graph.
          $out = "$env:GITHUB_WORKSPACE/.deps/tools/shaders"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & .deps/tools/glslang/bin/glslang.exe -V --target-env vulkan1.0 -S frag shaders/ui.frag.glsl -o "$out/ui.frag.spv"
          "frag exit: $LASTEXITCODE"
          & .deps/tools/glslang/bin/glslang.exe -V --target-env vulkan1.0 -S vert shaders/ui.vert.glsl -o "$out/ui.vert.spv"
          "vert exit: $LASTEXITCODE"
          Get-ChildItem $out | Select-Object Name, Length | Format-Table
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Core, native ACP, and compile gates
        shell: pwsh
        # Each option is quoted: PowerShell splits an unquoted `-Dname=value`
        # at the `=` and hands the rest to Zig as a step name.
        run: zig build verify "-Dsdl-prefix=.deps/win" "-Dghostty-prefix=.deps/install" "-Dshader-dir=.deps/tools/shaders" "-Dpython=python"
